{% extends 'layout.html' %}
{% block content %}
<div class="container py-5 text-center">
  <h2 class="mb-4">Welcome to Smart Prep App</h2>
  <p>Select your subject and year to begin.</p>

  <form action="{{ url_for('start') }}" method="POST" class="p-4">
    <div class="mb-3">
      <label class="form-label">Select Subject:</label>
      <select name="subject" class="form-select" required>
        <option value="english">English</option>
        <option value="physics">Physics</option>
        <option value="government">Government</option>
        <option value="literature_in_english">Literature-In-English</option>
        <option value="civic_education">Civic Education</option>
        <option value="mathematics">Mathematics</option>
        <option value="geography">Geography</option>
        <option value="economics">Economics</option>
        <option value="chemistry">Chemistry</option>
        <option value="commerce">Commerce</option>
        <option value="agricultural_science">Agricultural Science</option>
        <option value="history">History</option>
        <option value="christian Religious Knowledge">CRK</option>
        <option value="animal_husbandry">Animal Husbandry</option>
        <option value="biology">Biology</option>
        <option value="further_mathematics">Further_mathematics</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Select Year:</label>
      <select name="year" class="form-select" required>
        {% for y in years %}
        <option value="{{ y }}">{{ y }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Start Quiz</button>
  </form>
</div>
{% endblock %}
