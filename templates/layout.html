<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "WAEC Quiz App" }}</title>

  <!-- ✅ Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <!-- ✅ Custom Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <!-- ✅ MathJax for LaTeX Equations -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],       // inline equations
        displayMath: [['$$', '$$'], ['\\[', '\\]']],    // block equations
        processEscapes: true,
        tags: 'none'
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    async>
  </script>

  <!-- Optional Favicon -->
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🎓 WAEC Quiz</a>
      <div class="d-flex">
        <a href="{{ url_for('index') }}" class="btn btn-outline-light btn-sm me-2">Home</a>
        <a href="{{ url_for('results') }}" class="btn btn-outline-light btn-sm">Results</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4 mb-5">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}
    <!-- Page-specific content goes here -->
    {% endblock %}
  </main>

  <footer class="text-center text-muted small mt-5">
    <p>© {{ 2025 }} WAEC Smart Quiz App • Powered by Flask & OpenAI</p>
  </footer>

  <!-- ✅ Bootstrap JS (for alerts, modals, etc.) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous">
  </script>

  <!-- ✅ Auto-refresh MathJax on page load -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.MathJax) {
        MathJax.typesetPromise();
      }
    });
  </script>
</body>
</html>
