{% extends 'layout.html' %}
{% block content %}

<div class="d-flex justify-content-center mt-4">
  <div class="card shadow" style="max-width:480px; width:100%; border-radius:12px;">
    <div class="card-body p-4">
      <h4 class="mb-3" style="color:#0b59d7"><strong>Welcome back</strong></h4>
      <p class="text-muted">Log in to continue your quizzes.</p>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" placeholder="Password" required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="remember" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <button class="btn btn-primary w-100">Log in</button>
      </form>

      <div class="text-center mt-3">
        <small>Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></small>
      </div>
    </div>
  </div>
</div>

{% endblock %}
