{% extends 'layout.html' %}
{% block content %}

<div class="d-flex justify-content-center mt-4">
  <div class="card shadow" style="max-width: 520px; width:100%; border-radius:12px;">
    <div class="card-body p-4">
      <h4 class="mb-3" style="color:#0b59d7"><strong>Create your account</strong></h4>
      <p class="text-muted">Sign up to save progress and access quizzes later.</p>

      <form method="POST" action="{{ url_for('auth.signup') }}">
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input class="form-control" name="name" placeholder="Your name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" placeholder="Choose a strong password" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Confirm password</label>
          <input type="password" class="form-control" name="confirm_password" placeholder="Repeat password" required>
        </div>

        <button class="btn btn-primary w-100">Create account</button>
      </form>

      <div class="text-center mt-3">
        <small>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></small>
      </div>
    </div>
  </div>
</div>

{% endblock %}
